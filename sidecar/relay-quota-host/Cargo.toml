[package]
name = "relay-quota-host"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "relay_quota_host"
path = "src/lib.rs"

[[bin]]
name = "relay-quota-host"
path = "src/main.rs"

[dependencies]
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
ring = "=0.17.14"
rquickjs = { version = "=0.8.1", features = ["allocator", "array-buffer", "classes"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
url = "=2.5.8"
zeroize = "=1.9.0"
